name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Core logic tests
        run: node test/core.test.mjs

      - name: Bootstrap sandbox tests
        run: node test/bootstrap.test.mjs
